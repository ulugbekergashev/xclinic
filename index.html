<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Brauzer manzil qatorining rangi (S5.7, audit B-36). Yorug' va
       qorong'i tema uchun alohida — `index.css` dagi primary rangi. -->
  <meta name="theme-color" content="#f0f4f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12191d" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="XClinic — ko'p profilli klinika uchun boshqaruv tizimi: registratura, navbat, qabul, kassa, laboratoriya, ombor va statsionar." />
  <title>XClinic</title>
  <!-- SVG birinchi: har qanday o'lchamda tiniq. PNG eski brauzerlar uchun
       zaxira bo'lib qoldi (SVG favikonni tushunmaydiganlar hali uchraydi). -->
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="alternate icon" type="image/png" href="./logo-icon.png" />
  <!--
    DIQQAT: bu yerga CDN <script>/<link> QO'SHMANG (cdn.tailwindcss.com,
    fonts.googleapis.com, aistudiocdn.com va h.k.). XClinic internetsiz
    kompyuterlarda ishlaydi — tashqi resurs yuklanmay, dastur stilsiz
    yoki umuman ochilmay qoladi. Barcha stil va kutubxonalar bundle ichida:
    Tailwind → index.css, react/recharts/lucide → npm paketlari.
  -->
</head>

<body>
  <!-- TEMA — REACT'DAN OLDIN.

       Sinf ilgari `App.tsx` dagi `useEffect` da qo'yilardi, ya'ni birinchi
       kadr HAR DOIM yorug' chiqib, keyin qorong'iga o'tardi — qorong'ini
       tanlagan odam uchun bu ko'zga uradigan oq chaqnash.

       Skript `<div id="root">` dan oldin va `defer`siz turadi — brauzer uni
       birinchi bo'yashdan avval bajaradi. Qiymat `App.tsx` dagi
       boshlang'ich holat bilan bir xil: faqat `'dark'` — qorong'i, qolgan
       hammasi (jumladan yozuv yo'qligi) — yorug'.

       KALIT `xclinic_theme2`. Eski `xclinic_theme` da qorong'i SUKUT edi va
       dastur uni har ochilishda o'zi yozib qo'yardi — ya'ni har bir o'rnatmada
       hech kim tanlamagan «dark» turibdi. O'sha kalit o'qilsa, yangi yorug'
       palitra hech kimga ko'rinmasdi. Yangi kalit bilan hamma bir marta
       yorug'dan boshlaydi; qorong'ini tanlagan odamning tanlovi saqlanadi. -->
  <script>
    try {
      if (localStorage.getItem('xclinic_theme2') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
